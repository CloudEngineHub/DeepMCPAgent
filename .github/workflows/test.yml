name: Tests

on:
  push:
    branches: ["**"]  # Run on all branches
  pull_request:
    branches: [main, dev]
  workflow_dispatch:  # Allow manual trigger

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # A job takes up to ~25 minutes. pytest-timeout fails a hung test after 5;
    # this catches a hang outside any test (collection, teardown, exit).
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run linting (ruff)
        run: |
          ruff check src
          ruff format --check src

      - name: Run type checking (mypy)
        run: mypy src

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=src/promptise --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # The main matrix resolves to the mcp 2.x SDK. Promptise also supports
  # mcp>=1.9,<2 (promptise.mcp._compat); this job keeps 1.x tested.
  test-mcp-v1:
    name: MCP tests with the mcp 1.x SDK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies (mcp 1.x)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "mcp>=1.9,<2"
          python -c "import importlib.metadata as m; v = m.version('mcp'); print('mcp', v); assert v.startswith('1.'), v"

      - name: Run type checking (mypy) against mcp 1.x
        run: mypy src

      - name: Run the MCP tests
        run: |
          pytest -v \
            tests/test_mcp_*.py \
            tests/test_e2e_mcp_client.py \
            tests/test_e2e_mcp_server.py \
            tests/test_engine_mcp_integration.py \
            tests/test_approval_gate.py \
            tests/test_approval_agent_gate.py \
            tests/test_identity_token_refresh_e2e.py \
            tests/test_caller_token_forwarding.py \
            tests/test_cross_agent.py \
            tests/test_cross_agent_limits.py \
            tests/test_superagent_loader.py \
            tests/test_superagent_team.py \
            tests/test_runtime_process.py \
            tests/test_events_agent.py \
            tests/test_observability_fixes.py \
            tests/test_streaming_tool_turns.py \
            tests/test_mcpcast_emit.py \
            tests/test_mcpcast_schema_fidelity.py

  test-superagent:
    name: SuperAgent Feature Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test SuperAgent core modules
        run: |
          pytest tests/test_env_resolver.py -v
          pytest tests/test_superagent_schema.py -v
          pytest tests/test_superagent_loader.py -v

      - name: Test SuperAgent CLI commands
        run: |
          # Test init command
          promptise init -o test-agent.superagent -t basic
          test -f test-agent.superagent

          # Test validate command (should fail due to missing env vars, but command should work)
          promptise validate test-agent.superagent --no-check-env || true

          # Clean up
          rm -f test-agent.superagent

      - name: Validate example .superagent files
        run: |
          # Validate all .superagent files under examples/ (if any)
          shopt -s globstar nullglob
          found=0
          for file in examples/**/*.superagent; do
            found=1
            echo "Validating $file..."
            promptise validate "$file" --no-check-env --no-check-refs || exit 1
          done
          if [ "$found" -eq 0 ]; then
            echo "No .superagent example files found — skipping."
          fi

  lint-docs:
    name: Lint Documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history: the git-revision-date plugin warns on a shallow clone, and --strict fails on warnings

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Build docs (strict mode)
        run: mkdocs build --strict

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          # setuptools too: the runner's preinstalled copy carries advisories of its
          # own (PYSEC-2026-3447 in 79.x), and pip-audit audits the whole environment
          python -m pip install --upgrade pip "setuptools>=83"
          pip install bandit pip-audit
          pip install -e ".[all]"

      - name: Run Bandit security linter
        run: bandit -r src/ -ll

      # Fails the job on a known advisory in what `pip install promptise[all]`
      # resolves to (--skip-editable leaves out the checkout itself, which is not
      # on PyPI). Advisories without a fixed release are listed in
      # .github/pip-audit-ignore.txt with the reason and a review date, so an
      # unfixable one does not silently disable the gate for everything else.
      - name: Audit dependencies for known vulnerabilities (pip-audit)
        run: |
          IGNORES=$(grep -v '^[[:space:]]*#' .github/pip-audit-ignore.txt | grep -v '^[[:space:]]*$' | sed 's/^/--ignore-vuln=/' | tr '\n' ' ')
          echo "ignoring: ${IGNORES:-(nothing)}"
          pip-audit --skip-editable --progress-spinner off $IGNORES

  all-tests-passed:
    name: All Tests Passed
    needs: [test, test-mcp-v1, test-superagent, lint-docs, security]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check all jobs status
        run: |
          if [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.test-mcp-v1.result }}" != "success" ]] || \
             [[ "${{ needs.test-superagent.result }}" != "success" ]] || \
             [[ "${{ needs.lint-docs.result }}" != "success" ]] || \
             [[ "${{ needs.security.result }}" != "success" ]]; then
            echo "One or more test jobs failed!"
            exit 1
          fi
          echo "✅ All tests passed!"
